# Курс FPV: своя публикация GitVerse Pages (13.11.2026, по "ставь" Alexandr).
# Зачем: встроенная сборка Pages хранит копию сайта (артефакт 50-70 МБ) долго, и место под артефакты кончилось
# ("maximum allowed artifact storage quota exceeded"). Здесь копия хранится 1 день.
# Сайт статический (.nojekyll), поэтому Jekyll не нужен: публикуем файлы как есть.
# Включается в GitVerse: Настройки -> Страницы -> Источник: публикация из workflow (вместо "Ветка").
# Откат: Источник обратно "Ветка", main, / (root) - этот файл тогда можно удалить.
name: Pages (хранение 1 день)
# 18.11: с 13.11 этот файл ни разу не сработал - действий gitverse/upload-pages-artifact и gitverse/deploy-pages нет
# ("Repository not found"). Сайт всё это время публиковала встроенная сборка GitVerse. Имена взяты из её лога:
# https://gitverse.ru/actions/upload-pages-artifact@v1 и https://gitverse.ru/actions/deploy-pages@v1.

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      # 17.11 (выбор Alexandr): на сайт не выкладываем старые пробы и откаты - сайт ими не пользуется,
      # в репозитории они остаются. Так сайт ~44,5 МБ вместо ~49. Вернуть - убрать строку из списка ниже.
      - name: Collect site files
        run: |
          mkdir -p ../_site
          tar -cf - --exclude=./.git --exclude=./.github --exclude=./.gitverse \
            --exclude=./otkat \
            --exclude=./proba/modul2 --exclude=./proba/sborka --exclude=./proba/fpv --exclude=./proba/engine \
            --exclude=./proba/ekran --exclude=./proba/zadanie --exclude=./proba/index.html --exclude=./proba/perenos.html \
            . | tar -xf - -C ../_site
          du -sh ../_site
          mv ../_site ./_site
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v1
        with:
          path: _site
          retention-days: 1
  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy
        uses: actions/deploy-pages@v1
