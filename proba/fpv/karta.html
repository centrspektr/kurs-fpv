<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Курс FPV - карта</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Marck+Script&family=Unbounded:wght@500;700&family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="config.js"></script>
<style>
  /* Вид как у портала "Иртыш": стекло, шрифты Unbounded и Manrope, рукописное название */
  :root{
    --bg:#04050d; --fg:#f1f3ff; --dim:#a7acd2; --glass:rgba(14,18,40,.62); --line:rgba(170,180,255,.24);
    --display:'Unbounded','Arial Black',system-ui,sans-serif; --body:'Manrope',system-ui,-apple-system,sans-serif;
    color-scheme:dark;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--fg);font-family:var(--body);-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
  #c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
  #cm{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:2}
  button{font:inherit}
  /* рукописное "Взлёт" на входе */
  #ttl{position:fixed;left:50%;top:7%;width:min(92vw,620px);transform:translateX(-50%);pointer-events:none;z-index:4;overflow:visible;transition:opacity .6s}
  #ttl .tw{font-family:'Marck Script','Segoe Script','Brush Script MT',cursive;font-size:168px;fill:url(#tg);fill-opacity:0;stroke:url(#tg);stroke-width:1.6;stroke-linejoin:round;stroke-dasharray:1400;stroke-dashoffset:1400;filter:drop-shadow(0 0 12px rgba(167,139,250,.55))}
  #ttl.on .tw{animation:tw-write 2.8s cubic-bezier(.5,0,.3,1) forwards,tw-fill 1.4s 2s ease forwards}
  #ttl .ts{font:700 15px var(--body);letter-spacing:.32em;fill:var(--dim);opacity:0}
  #ttl.on .ts{animation:tw-fill 1s 2.6s forwards}
  @keyframes tw-write{to{stroke-dashoffset:0}}
  @keyframes tw-fill{to{fill-opacity:1;opacity:1}}
  /* подписи узлов */
  #leads{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:3;overflow:visible}
  #leads polyline,#leads circle{transition:opacity .35s;filter:drop-shadow(0 0 3px rgba(0,0,0,.8))}
  #labels{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:3}
  .lb{position:absolute;left:0;top:0;max-width:min(240px,70vw);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font:700 13px var(--body);color:#fff;padding:7px 13px;border-radius:99px;background:var(--glass);border:1px solid var(--pc,var(--line));cursor:pointer;opacity:0;transition:opacity .35s;will-change:transform}
  .lb.big{font-size:15px;padding:9px 16px}
  .lb.sh{min-width:30px;padding:5px 10px;font-size:12px;text-align:center}
  .lb.s-done:before{content:"✓ ";color:#4ade80}
  .lb.s-wait{border-color:#facc15}.lb.s-wait:before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:#facc15;margin-right:6px;vertical-align:1px}
  .lb.s-lock{border-style:dashed;border-color:var(--line);color:#d6d3ff;font-weight:600}
  /* надпись при подлёте */
  #cap{position:fixed;left:0;right:0;bottom:calc(96px + env(safe-area-inset-bottom,0px));text-align:center;z-index:5;opacity:0;transform:translateY(10px);transition:opacity .5s,transform .5s;pointer-events:none;padding:0 16px}
  #cap.on{opacity:1;transform:none;pointer-events:auto}
  #capT{font-family:var(--display);font-weight:700;font-size:clamp(20px,5.6vw,32px);margin:0 0 4px;text-shadow:0 0 22px var(--pc,#7cf3ff);cursor:pointer;text-wrap:balance}
  #cap.lock #capT{text-shadow:none;color:#d6d3ff}
  #capS{margin:0 0 6px;color:var(--dim);font-size:13px}
  #capP{margin:0;color:var(--dim);font-size:14px}#capP b{color:var(--fg)}
  /* верх: где ты; низ: что дальше */
  #hud{position:fixed;left:calc(max(16px,env(safe-area-inset-left,0px)) + 56px);top:calc(14px + env(safe-area-inset-top,0px));z-index:6;opacity:0;transition:opacity .4s;pointer-events:none;max-width:calc(100vw - 210px)}
  #hud.on{opacity:1}
  #hud small{display:block;color:var(--dim);font:700 11px var(--body);letter-spacing:.2em;text-transform:uppercase}
  #hudL{font:700 14px var(--display);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #back{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:max(16px,env(safe-area-inset-left,0px));z-index:6;width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--glass);color:var(--fg);font:700 20px var(--body);cursor:pointer;opacity:0;pointer-events:none;transition:opacity .4s}
  #back.on{opacity:1;pointer-events:auto}
  #topB{position:fixed;top:calc(64px + env(safe-area-inset-top,0px));left:max(16px,env(safe-area-inset-left,0px));z-index:6;min-height:40px;padding:0 14px;border-radius:99px;border:1px solid var(--line);background:var(--glass);color:var(--fg);font:700 13px var(--body);cursor:pointer;opacity:0;pointer-events:none;transition:opacity .4s}
  #topB.on{opacity:1;pointer-events:auto}#topB.act{border-color:#7cf3ff;box-shadow:0 0 0 2px rgba(124,243,255,.35),0 0 18px rgba(124,243,255,.4)}
  #plainB{position:fixed;top:calc(14px + env(safe-area-inset-top,0px));right:max(16px,env(safe-area-inset-right,0px));z-index:6;min-height:36px;padding:0 14px;border-radius:99px;border:1px solid var(--line);background:var(--glass);color:var(--dim);font:700 12.5px var(--body);cursor:pointer}
  #tourB{position:fixed;top:calc(58px + env(safe-area-inset-top,0px));right:max(16px,env(safe-area-inset-right,0px));z-index:6;min-height:36px;padding:0 14px;border-radius:99px;border:1px solid rgba(167,139,250,.55);background:var(--glass);color:var(--fg);font:700 12.5px var(--body);cursor:pointer}
  #tourB[hidden]{display:none}
  #autoB{position:fixed;top:calc(102px + env(safe-area-inset-top,0px));right:max(16px,env(safe-area-inset-right,0px));z-index:6;min-height:36px;padding:0 14px;border-radius:99px;border:1px solid var(--line);background:var(--glass);color:var(--dim);font:700 12.5px var(--body);cursor:pointer}
  #autoB.act{color:var(--fg);border-color:#9dff7c;box-shadow:0 0 14px rgba(157,255,124,.35)}
  #autoB[hidden]{display:none}
  #guide{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translate(-50%,10px);z-index:6;width:min(calc(100vw - 32px),520px);display:flex;align-items:center;gap:10px;padding:8px 8px 8px 18px;border-radius:99px;background:rgba(20,16,48,.62);border:1px solid rgba(167,139,250,.55);box-shadow:0 0 22px rgba(167,139,250,.3);opacity:0;pointer-events:none;transition:opacity .35s,transform .35s}
  #guide.on{opacity:1;pointer-events:auto;transform:translate(-50%,0)}
  #gTxt{flex:1;min-width:0;font-size:13.5px;line-height:1.3;color:var(--dim)}#gTxt b{color:var(--fg)}
  #gBtn{flex:none;min-height:42px;padding:0 18px;border-radius:99px;border:0;background:linear-gradient(135deg,#7cf3ff,#a78bfa 55%,#ff7ce0);color:#0b0820;font-weight:800;cursor:pointer}
  #ptr{position:fixed;left:0;top:0;z-index:3;pointer-events:none;opacity:0;transition:opacity .3s;color:#facc15;font:800 13px var(--body);letter-spacing:.06em;text-align:center;text-shadow:0 0 10px rgba(250,204,21,.8)}
  #ptr i{display:block;font-style:normal;font-size:20px;line-height:1;animation:bob 1.6s ease-in-out infinite}
  @keyframes bob{50%{transform:translateY(5px)}}
  #arrow{position:fixed;left:0;top:0;z-index:4;width:46px;height:46px;border-radius:50%;border:1px solid rgba(250,204,21,.8);background:var(--glass);color:#facc15;font-size:22px;font-weight:900;cursor:pointer;opacity:0;transition:opacity .3s;box-shadow:0 0 18px rgba(250,204,21,.45)}
  /* вход: "Добро пожаловать" */
  #wel{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,12px);z-index:6;width:min(calc(100vw - 32px),460px);text-align:center;opacity:0;pointer-events:none;transition:opacity .6s,transform .6s}
  #wel.on{opacity:1;pointer-events:auto;transform:translate(-50%,0)}
  #welHi{color:#7cf3ff;font-weight:800;margin-bottom:4px}
  #wel h1{margin:0 0 8px;font:700 clamp(18px,5vw,26px) var(--display);text-shadow:0 0 22px rgba(167,139,250,.7);text-wrap:balance}
  #wel p{margin:0 auto 16px;max-width:400px;color:var(--dim);font-size:14.5px;line-height:1.45}
  #goB{color:var(--fg);font:700 15px var(--body);letter-spacing:.04em;padding:12px 26px;border-radius:99px;border:1px solid rgba(167,139,250,.55);background:rgba(20,16,48,.55);box-shadow:0 0 22px rgba(167,139,250,.35);cursor:pointer}
  #goB b{display:inline-block;animation:bob 1.6s ease-in-out infinite}
  #codeL{display:block;margin:12px auto 0;background:none;border:0;color:var(--dim);text-decoration:underline;cursor:pointer;font-size:13px}
  /* вспышка при провале и заставка модуля */
  #flash{position:fixed;inset:0;background:radial-gradient(circle,#fff,var(--fl,rgba(255,255,255,.85)) 40%,rgba(255,255,255,0) 78%);opacity:0;pointer-events:none;z-index:30}
  #warp{position:fixed;inset:0;z-index:29;display:grid;place-items:center;opacity:0;pointer-events:none;transition:opacity .5s;background:radial-gradient(circle at 50% 55%,color-mix(in srgb,var(--wc,#7cf3ff) 55%,#fff) 0%,var(--wc,#7cf3ff) 30%,#05030f 85%)}
  #warp.on{opacity:1}
  #warp b{font:700 clamp(26px,8vw,48px) var(--display);color:#fff;text-align:center;padding:0 16px;text-shadow:0 0 30px var(--wc,#7cf3ff);transform:scale(.9);transition:transform 1.1s}
  #warp.on b{transform:scale(1.06)}
  /* окно задания: плоское, читаемое, под ним свой фон */
  #win{position:fixed;inset:0;z-index:20;display:none;--mr:124,243,255}
  #win.on{display:block}
  .wbg{position:absolute;inset:-4%;background-size:cover;background-position:center;animation:drift 40s ease-in-out infinite alternate}
  @keyframes drift{to{transform:scale(1.06) translate(1.5%,-1%)}}
  .bg-aur{background-color:#070a1c;background-image:radial-gradient(55% 45% at 18% 22%,rgba(var(--mr),.38),transparent 70%),radial-gradient(50% 40% at 85% 78%,rgba(167,139,250,.3),transparent 70%),radial-gradient(1px 1px at 30% 60%,#fff,transparent),radial-gradient(1px 1px at 70% 30%,#fff,transparent),radial-gradient(1.5px 1.5px at 85% 15%,#fff,transparent),linear-gradient(160deg,#070a1c,#0b0620)}
  .bg-sky{background-color:#0a1a3a;background-image:radial-gradient(14% 18% at 78% 74%,rgba(255,214,140,.9),rgba(255,170,90,.25) 60%,transparent),linear-gradient(180deg,#0b2a4a 0%,#2b6d8f 40%,#f2b880 72%,#f7d9a8 82%,#3b2414 82.4%,#1a120c 100%)}
  .bg-grid{background-color:#060818;background-image:radial-gradient(60% 50% at 50% 100%,rgba(var(--mr),.35),transparent 70%),linear-gradient(rgba(var(--mr),.18) 1px,transparent 1px),linear-gradient(90deg,rgba(var(--mr),.18) 1px,transparent 1px);background-size:100% 100%,44px 44px,44px 44px}
  .bg-shop{background-color:#140c06;background-image:radial-gradient(60% 50% at 50% 0%,rgba(255,170,80,.42),transparent 70%),radial-gradient(40% 30% at 15% 90%,rgba(var(--mr),.22),transparent 70%),repeating-linear-gradient(90deg,rgba(255,255,255,.035) 0 2px,transparent 2px 64px),linear-gradient(#1c1209,#0c0805)}
  .bg-neb{background-color:#0b0418;background-image:radial-gradient(45% 40% at 25% 35%,rgba(255,90,200,.38),transparent 70%),radial-gradient(45% 45% at 78% 65%,rgba(var(--mr),.32),transparent 70%),radial-gradient(1px 1px at 12% 20%,#fff,transparent),radial-gradient(1px 1px at 52% 80%,#fff,transparent),radial-gradient(1.5px 1.5px at 66% 12%,#fff,transparent),radial-gradient(1px 1px at 90% 44%,#fff,transparent),linear-gradient(200deg,#120624,#05030d)}
  .wpane{position:absolute;inset:0;overflow:auto;-webkit-overflow-scrolling:touch;padding:calc(12px + env(safe-area-inset-top,0px)) 16px 48px}
  .wbox{max-width:780px;margin:0 auto;background:rgba(10,13,30,.9);border:1px solid rgba(var(--mr),.4);border-radius:22px;padding:12px 14px 16px;box-shadow:0 30px 80px -30px rgba(0,0,0,.9);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
  .wtop{position:sticky;top:-12px;z-index:3;display:flex;align-items:center;gap:12px;margin:-12px -14px 12px;padding:12px 14px;border-radius:22px 22px 0 0;background:rgba(10,13,30,.96);border-bottom:1px solid rgba(var(--mr),.25)}
  #winX{flex:none;min-height:40px;padding:0 16px;border-radius:99px;border:1px solid var(--line);background:var(--glass);color:var(--fg);font-weight:700;cursor:pointer}
  #winT{flex:1;min-width:0;font:700 13px var(--display);color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #toast{position:fixed;bottom:20px;left:50%;transform:translate(-50%,20px);background:var(--glass);border:1px solid var(--line);color:var(--fg);padding:10px 18px;border-radius:99px;font-size:14px;opacity:0;transition:.25s;pointer-events:none;z-index:99;max-width:90vw}
  #toast.show{opacity:1;transform:translate(-50%,0)}
  .lb:focus-visible,#back:focus-visible,#goB:focus-visible,#gBtn:focus-visible,#winX:focus-visible,#plainB:focus-visible,#arrow:focus-visible{outline:2px solid #7cf3ff;outline-offset:2px}
  /* правка 6: "Уровень N" при пролёте ворот и счётчик звёзд модуля */
  #lvl{position:fixed;left:50%;top:calc(18% + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:7;pointer-events:none;opacity:0;font:700 clamp(22px,6vw,38px) var(--display);color:#fff;text-shadow:0 0 24px var(--lc,#7cf3ff);white-space:nowrap}
  #lvl.on{animation:lvl 1.5s ease forwards}
  @keyframes lvl{0%{opacity:0;transform:translateX(-50%) scale(.7)}20%{opacity:1;transform:translateX(-50%) scale(1.05)}75%{opacity:1;transform:translateX(-50%) scale(1)}100%{opacity:0;transform:translateX(-50%) scale(1.1)}}
  #stars{position:fixed;left:50%;top:calc(66px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:6;padding:6px 14px;border-radius:99px;background:var(--glass);border:1px solid rgba(255,211,110,.55);color:#ffd36e;font:800 14px var(--body);font-variant-numeric:tabular-nums;opacity:0;transition:opacity .4s;pointer-events:none;white-space:nowrap}
  #stars.on{opacity:1}
  .starfly{position:fixed;left:0;top:0;z-index:8;pointer-events:none;color:#ffd36e;font-size:26px;line-height:1;text-shadow:0 0 14px rgba(255,211,110,.9)}
  /* правка 7: экран пилота FPV, пока ныряем в здание модуля */
  #osd{position:fixed;inset:max(12px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) max(12px,env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px));z-index:7;pointer-events:none;opacity:0;transition:opacity .3s;border:2px solid rgba(241,243,255,.75);border-radius:26px;font:800 13px ui-monospace,Menlo,Consolas,monospace;color:#9dff7c;text-shadow:0 0 6px rgba(0,0,0,.9)}
  #osd.on{opacity:1}
  body.osd #back,body.osd #topB,body.osd #hud,body.osd #plainB,body.osd #tourB,body.osd #autoB,body.osd #labels,body.osd #leads{opacity:0!important;pointer-events:none}
  #osd span{position:absolute}
  #osd .tl{left:20px;top:16px}#osd .tr{right:20px;top:16px}#osd .bl{left:20px;bottom:16px}#osd .br{right:20px;bottom:16px}
  #osd .x{left:50%;top:50%;transform:translate(-50%,-50%);color:#f1f3ff;font-size:22px}
  #osd .rec{color:#ff4d6d}
  @media (prefers-reduced-motion:reduce){#lvl.on{animation:none;opacity:0}}
  @media (prefers-reduced-motion:reduce){.wbg,#ptr i,#goB b{animation:none}}
</style>
</head>
<body>
<canvas id="c" aria-label="Карта курса: город Взлёт, модули и задания"></canvas>
<canvas id="cm" aria-hidden="true"></canvas>
<svg id="ttl" viewBox="0 0 620 250" role="img" aria-label="Взлёт, курс пилота"><defs><linearGradient id="tg" x1="0" x2="1"><stop offset="0" stop-color="#7cf3ff"/><stop offset=".4" stop-color="#a78bfa"/><stop offset=".75" stop-color="#ff7ce0"/><stop offset="1" stop-color="#ffd36e"/></linearGradient></defs><text class="tw" x="310" y="168" text-anchor="middle">Взлёт</text><text class="ts" x="318" y="226" text-anchor="middle">КУРС ПИЛОТА</text></svg>
<svg id="leads" aria-hidden="true"></svg>
<div id="labels"></div>

<button id="back" type="button" aria-label="Назад">←</button>
<button id="topB" type="button">☀ Сверху</button>
<div id="hud"><small id="hudC"></small><div id="hudL"></div></div>
<button id="plainB" type="button">Обычный вид</button>
<button id="tourB" type="button" hidden>Что где?</button>
<button id="autoB" type="button" hidden>Автополёт: выкл</button>

<div id="wel">
  <div id="welHi"></div>
  <h1>Добро пожаловать во Взлёт</h1>
  <p>Это карта твоего курса пилота. Модули - здания летающего города, а внутри каждого - своя локация с заданиями вдоль дороги. Пройденное остаётся гореть, а указатель всегда покажет, куда лететь дальше.</p>
  <button id="goB" type="button">Полетели вперёд <b>↓</b></button>
  <button id="codeL" type="button" hidden>У меня есть код от педагога</button>
</div>

<div id="cap" aria-live="polite"><h2 id="capT"></h2><div id="capS"></div><p id="capP"></p></div>
<div id="ptr"><i>▼</i>сюда</div>
<button id="arrow" type="button" aria-label="К следующему заданию">➜</button>
<div id="guide" role="status"><div id="gTxt"></div><button id="gBtn" type="button"></button></div>

<div id="win" role="dialog" aria-modal="true" aria-labelledby="winT">
  <div class="wbg" id="wbg"></div>
  <div class="wpane" id="wpane"><div class="wbox">
    <div class="wtop"><button id="winX" type="button">← К карте</button><div id="winT"></div></div>
    <div id="t-kurs"></div>
  </div></div>
</div>
<div id="lvl" aria-hidden="true"><span id="lvlT"></span></div>
<div id="stars" aria-label="Пройдено заданий в модуле">★ <span id="starsN"></span></div>
<div id="osd" aria-hidden="true"><span class="tl rec">● REC</span><span class="tr" id="osdB">BAT 96%</span><span class="bl" id="osdA">ALT 0 м</span><span class="br" id="osdS">SPD 0 км/ч</span><span class="x">+</span></div>
<div id="warp" aria-hidden="true"><b id="warpT"></b></div>
<div id="flash"></div>
<div id="toast"></div>

<script>
/* карта - для учеников; окно педагога остаётся на обычной странице */
const MODE = 'public';
document.getElementById('hudC').textContent = (window.KURSY && KURSY.name) || 'Курс';
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js" defer></script>
<script src="modeli.js" defer></script>
<script src="zadaniya.js" defer></script>
<script src="../engine/moduli.js" defer></script>
<script src="../engine/kosmos-kurs.js" defer></script>
</body>
</html>
