<!DOCTYPE html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0b0816"><title>Собери дрон - Взлёт</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}html,body{height:100%}
body{background:#0b0816;font-family:"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;color:#f1f3ff;overflow:hidden;position:fixed;inset:0;--a:#c77dff;touch-action:none;user-select:none;-webkit-user-select:none}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#ui{position:absolute;inset:0;pointer-events:none}#ui>*{position:absolute;z-index:3;pointer-events:auto}
button{font:inherit;color:inherit;border:0;cursor:pointer;background:none}
.top{left:0;right:0;top:0;padding:12px 14px 26px;display:flex;align-items:center;gap:10px;background:linear-gradient(#05030ccc,#05030c00);pointer-events:none!important}
.top>*{pointer-events:auto}
.ic{width:36px;height:36px;border-radius:50%;background:#ffffff14;border:1px solid #ffffff2a;display:grid;place-items:center;font-size:16px;backdrop-filter:blur(8px)}
a.ic{color:inherit;text-decoration:none}#err{font-weight:800;font-size:14px;color:#ff8a92}
.ttl{flex:1}.ttl small{display:block;font-size:10px;letter-spacing:.16em;color:#cdb6ff;font-weight:800}.ttl b{font-size:16px;font-weight:700}
.bars{top:60px;left:14px;right:14px;display:flex;gap:4px;pointer-events:none!important}.bars i{flex:1;height:4px;border-radius:2px;background:#ffffff26}.bars i.d{background:var(--a);box-shadow:0 0 8px var(--a)}.bars i.h{background:linear-gradient(90deg,var(--a) 55%,#ffffff26 55%)}
.glass{background:#120a24c4;border:1px solid #ffffff22;border-radius:16px;backdrop-filter:blur(12px);box-shadow:0 8px 24px #0007}
/* компактная карточка проводника сверху */
.bub{top:74px;left:50%;transform:translateX(-50%);width:min(calc(100vw - 24px),430px);padding:10px 13px;font-size:13.5px;line-height:1.4}
.bub b{color:#e3c8ff}.bub.end{top:auto;bottom:18px;width:min(calc(100vw - 110px),400px);left:14px;transform:none}
.chip{display:inline-block;font-size:10px;font-weight:800;letter-spacing:.1em;padding:2px 8px;border-radius:20px;margin-right:4px;vertical-align:1px}
.chip.bad{background:#ff5d6c33;color:#ff8a92}.bub.bad{border-color:#ff5d6c;background:#2a0f17e6}
.shake{animation:sh .4s}@keyframes sh{0%,100%{transform:translateX(-50%)}25%{transform:translateX(calc(-50% - 6px))}75%{transform:translateX(calc(-50% + 6px))}}
/* вопросы: маленькие кнопки в той же карточке */
.qs{display:flex;flex-wrap:wrap;gap:6px}.qs:not(:empty){margin-top:9px}
.qs button{padding:7px 13px;border-radius:20px;background:#ffffff14;border:1px solid #ffffff2e;font-weight:800;font-size:13px;display:flex;align-items:center;gap:7px}
.qs button:hover{border-color:var(--a)}.qs button.w{flex:1 1 100%;font-size:12.5px;padding:7px 10px;text-align:left}
.qs button.ok{border-color:#5effc4;background:#0f2a26;color:#5effc4}.qs button.no{border-color:#ff5d6c;background:#3a0f18;animation:sh2 .35s}
@keyframes sh2{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.qs .num{width:20px;height:20px;border-radius:50%;background:#ffffff1a;display:grid;place-items:center;flex:none;font-size:11px}.qs .ok .num{background:#5effc4;color:#062}
.hint{left:50%;bottom:16px;transform:translateX(-50%);padding:7px 14px;border-radius:20px;background:#0b0816b0;border:1px solid #ffffff1c;font-size:12px;color:#cfc4ec;white-space:nowrap;pointer-events:none!important}
.tag{display:none;transform:translateX(-50%);padding:5px 10px;border-radius:12px;background:#0b0816e6;border:1px solid var(--a);font-size:12px;font-weight:800;white-space:nowrap;pointer-events:none!important;z-index:6!important}
.btn{left:50%;transform:translateX(-50%);bottom:24px;width:min(calc(100vw - 32px),360px);padding:15px;border-radius:16px;text-align:center;font-weight:800;font-size:16px;color:#fff;background:linear-gradient(90deg,#8b3dff,#c77dff);box-shadow:0 0 30px #c77dff88}
/* инструменты пайки */
.tools{left:50%;transform:translateX(-50%);bottom:16px;display:flex;gap:10px}
.tb{white-space:nowrap;display:flex;align-items:center;gap:7px;padding:11px 16px;border-radius:30px;background:#120a24d0;border:1px solid #ffffff2a;font-weight:800;font-size:14px;backdrop-filter:blur(10px)}
.tb b{font-size:16px}.tb.go{border-color:#ffd166;box-shadow:0 0 0 5px #ffd16626,0 0 22px #ffd16677;animation:pu 1.4s infinite}
.tb.hold{background:#ffd166;color:#1a1300;border-color:#ffd166;padding:11px 20px}.tb.hold:active{transform:scale(.96)}
@keyframes pu{50%{box-shadow:0 0 0 9px #ffd16610,0 0 26px #ffd166aa}}
/* кольцо нагрева вокруг площадки */
.hr{display:none;width:84px;height:84px;margin:-42px 0 0 -42px;border-radius:50%;pointer-events:none!important;--h:0;
 background:conic-gradient(#3b5bdb 0 50%,#2fbf71 50% 86%,#e03131 86% 100%);-webkit-mask:radial-gradient(circle,transparent 33px,#000 34px,#000 40px,transparent 41px);mask:radial-gradient(circle,transparent 33px,#000 34px,#000 40px,transparent 41px);opacity:.55}
.hr i{position:absolute;inset:0;border-radius:50%;background:conic-gradient(#fff calc(var(--h)*360deg),transparent 0)}
.hr.on{opacity:1}.hr.melt{opacity:1;filter:hue-rotate(160deg)}
.toast{position:fixed;left:50%;bottom:80px;transform:translateX(-50%);background:#0f2a26f0;border:1px solid #5effc4;color:#5effc4;font-weight:800;font-size:13px;padding:7px 15px;border-radius:30px;z-index:9;animation:tin .3s;pointer-events:none}
@keyframes tin{from{opacity:0;transform:translate(-50%,-10px)}}
.big{left:0;right:0;top:90px;text-align:center;pointer-events:none!important}.big b{font-size:30px;font-weight:900;color:#5effc4;text-shadow:0 0 18px #5effc4aa;display:block}.big span{font-size:13.5px;color:#e9d8ff}
.stats{display:inline-flex;gap:8px;margin-top:10px}.stats span{padding:6px 11px;border-radius:20px;background:#ffffff14;font-size:12px;font-weight:800}
.next{right:18px;bottom:20px;width:62px;height:62px;border-radius:50%;background:var(--a);color:#14051f;display:grid;place-items:center;font-size:28px;font-weight:800;box-shadow:0 0 0 8px #c77dff40,0 0 34px var(--a)}
@media (min-width:760px){.bub{font-size:14.5px;width:470px}}
</style></head><body><canvas id="c"></canvas><div id="ui"></div>
<script>window.KURSY={store:"kursy_fpv_gorod"};</script><script src="golos.js"></script><script src="three.min.js"></script><script src="RoomEnvironment.js"></script><script src="scene.js"></script><script src="stage.js"></script><script>window.SB_LV=1;</script><script src="game.js"></script>
</body></html>
