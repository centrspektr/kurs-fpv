<!DOCTYPE html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0b0816"><title>Собери дрон - Взлёт</title>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}html,body{height:100%}body{background:#0b0816;font-family:Manrope,sans-serif;color:#f1f3ff;overflow:hidden;position:fixed;inset:0;--a:#c77dff;touch-action:none;user-select:none;-webkit-user-select:none}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#ui>*{position:absolute;z-index:3}
.top{left:0;right:0;top:0;padding:16px 16px 34px;display:flex;align-items:center;gap:10px;background:linear-gradient(#05030ccc,#05030c00)}
.ic{width:38px;height:38px;border-radius:50%;background:#ffffff14;border:1px solid #ffffff2a;display:grid;place-items:center;font-size:17px;backdrop-filter:blur(8px)}
.ttl{flex:1}.ttl small{display:block;font-size:10px;letter-spacing:.16em;color:#cdb6ff;font-weight:800}.ttl b{font-family:Unbounded;font-size:16px;font-weight:500}
.bars{top:70px;left:16px;right:16px;display:flex;gap:4px}.bars i{flex:1;height:4px;border-radius:2px;background:#ffffff26}.bars i.d{background:var(--a);box-shadow:0 0 8px var(--a)}.bars i.h{background:linear-gradient(90deg,var(--a) 55%,#ffffff26 55%)}
.glass{background:#120a24b8;border:1px solid #ffffff22;border-radius:18px;backdrop-filter:blur(14px);box-shadow:0 10px 30px #0008}
.bub{left:16px;right:16px;padding:13px 15px;font-size:14.5px;line-height:1.42}.bub b{color:#e3c8ff}
.chip{display:inline-block;font-size:10.5px;font-weight:800;letter-spacing:.1em;padding:3px 9px;border-radius:20px;background:#c77dff33;color:#e3c8ff;margin-bottom:6px}
.who{display:flex;align-items:center;gap:8px;margin-bottom:6px}.who i{width:22px;height:22px;border-radius:50%;background:radial-gradient(circle at 60% 45%,#00d4ff 0 28%,#eaf6ff 30%);box-shadow:0 0 10px #00d4ff}
.who span{font-size:10.5px;font-weight:800;letter-spacing:.12em;color:#7cf3ff}
.next{right:18px;bottom:22px;width:64px;height:64px;border-radius:50%;background:var(--a);color:#14051f;display:grid;place-items:center;font-size:28px;font-weight:800;box-shadow:0 0 0 8px #c77dff40,0 0 34px var(--a)}
.btn{left:16px;right:16px;bottom:24px;padding:16px;border-radius:18px;text-align:center;font-weight:800;font-size:16px;background:linear-gradient(90deg,#8b3dff,#c77dff);box-shadow:0 0 30px #c77dff88}
.tray{left:12px;right:12px;bottom:14px;padding:11px 12px}.tray .l{font-size:10px;letter-spacing:.14em;color:#b9a6e6;font-weight:800;margin-bottom:8px}
.parts{display:flex;gap:8px}.pt{flex:1;height:66px;border-radius:14px;background:#ffffff0d;border:1px solid #ffffff1f;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:10.5px;font-weight:800;gap:3px}
.pt svg{width:32px;height:26px}.pt.go{border-color:var(--a);background:#c77dff26;box-shadow:0 0 16px #c77dff66}.pt.off{opacity:.35}
.steps{display:flex;gap:6px;flex-wrap:wrap}.steps span{padding:5px 10px;border-radius:20px;font-size:12px;font-weight:800;background:#ffffff14;color:#b9b3d6}
.steps .ok{background:#5effc42e;color:#5effc4}.steps .now{background:#ffd16633;color:#ffd166;box-shadow:0 0 12px #ffd16655}
.heat{left:16px;right:16px;bottom:106px;padding:12px 14px}.hb{height:16px;border-radius:8px;background:linear-gradient(90deg,#3b5bdb 0 34%,#2fbf71 34% 68%,#e03131 68%);position:relative;margin:6px 0 4px}
.hb i{position:absolute;left:55%;top:-6px;width:5px;height:28px;border-radius:3px;background:#fff;box-shadow:0 0 10px #fff}.hl{display:flex;justify-content:space-between;font-size:10.5px;color:#b9b3d6}
.hold{left:50%;bottom:26px;transform:translateX(-50%);width:230px;padding:16px;border-radius:40px;background:#ffd166;color:#1a1300;text-align:center;font-weight:800;font-size:16px;box-shadow:0 0 0 8px #ffd16633,0 0 34px #ffd16699}
.ch{left:16px;right:16px;bottom:20px;display:flex;flex-direction:column;gap:9px}.ch div{padding:14px 15px;display:flex;align-items:center;gap:12px;font-weight:800;font-size:15px}
.ch svg{width:40px;height:30px;flex:none}.ch .ok{border-color:#5effc4;background:#0f2a26cc;box-shadow:0 0 18px #5effc455}
.big{left:0;right:0;top:96px;text-align:center}.big b{font-family:Unbounded;font-size:30px;color:#5effc4;text-shadow:0 0 18px #5effc4aa;display:block}.big span{font-size:13.5px;color:#e9d8ff}
.stats{display:inline-flex;gap:8px;margin-top:10px}.stats span{padding:6px 11px;border-radius:20px;background:#ffffff14;font-size:12px;font-weight:800}

#ui{position:absolute;inset:0;pointer-events:none}#ui>*{pointer-events:auto}
a.ic{color:inherit;text-decoration:none}#err{font-weight:800;font-size:14px;color:#ff8a92}
button{font:inherit;color:inherit;border:0;cursor:pointer}
.btn{color:#fff}.hold{border:0}.hold:disabled{opacity:.5}.hold:not(.y){background:#c77dff;color:#14051f;box-shadow:0 0 0 8px #c77dff33,0 0 34px #c77dff99}
.ch button{padding:14px 15px;display:flex;align-items:center;gap:12px;font-weight:800;font-size:15px;text-align:left;border:1px solid #ffffff22;width:100%}
.ch button svg{width:40px;height:30px;flex:none}.ch button.ok{border-color:#5effc4;background:#0f2a26cc;box-shadow:0 0 18px #5effc455}.ch button.no{border-color:#ff5d6c;background:#3a0f18cc;animation:sh .4s}
.ch .num{width:26px;height:26px;border-radius:50%;background:#ffffff14;display:grid;place-items:center;flex:none;font-size:13px}.ch .ok .num{background:#5effc4;color:#062}
.bub.bad{border-color:#ff5d6c;background:#2a0f17e6}.chip.bad{background:#ff5d6c33;color:#ff8a92}.shake{animation:sh .4s}
@keyframes sh{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.pt{touch-action:none;cursor:grab}.pt.drag{opacity:.4}
.heat .hl0{font-size:10px;letter-spacing:.14em;color:#b9a6e6;font-weight:800}.hb i{transition:none}
.pad{position:absolute;width:52px;height:46px;transform:translate(-50%,-50%);border-radius:10px;background:transparent;border:2px dashed #7cf3ff88;animation:pp 1.6s infinite}
@keyframes pp{50%{border-color:#7cf3ff;box-shadow:0 0 16px #7cf3ff88}}
.toast{position:fixed;left:50%;top:120px;transform:translateX(-50%);background:#0f2a26f0;border:1px solid #5effc4;color:#5effc4;font-weight:800;padding:10px 18px;border-radius:30px;z-index:9;animation:tin .3s}
@keyframes tin{from{opacity:0;transform:translate(-50%,-10px)}}
.next{border:0}
</style></head><body><canvas id="c"></canvas><div id="ui"></div>
<script src="three.min.js"></script><script src="RoomEnvironment.js"></script><script src="scene.js"></script><script src="stage.js"></script><script>window.SB_LV=1;</script><script src="game.js"></script>
</body></html>
